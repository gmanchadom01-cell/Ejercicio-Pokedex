<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PKM</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="card">

        <input type="text" id="pokemonName" placeholder="Nombre del Pokémon">

        <button id="btnBuscar">Buscar Pokémon</button>

        <p id="mensaje"></p>

        <img id="image" src="./pokeball.png" alt="pokemon">

        <h1 id="name"></h1>
        <h3 id="number"></h3>

        <p id="height"></p>
        <p id="weight"></p>

        <div id="types"></div>

        <button id="btnCargar">Cargar Pokemon</button>
    </div>

    <section id="pokedex">

    <h2>Mi primera Pokédex</h2>

    <ul id="listaPokemon"></ul>

    <div id="navegacion">
        <button id="btnAnterior">Anterior</button>
        <button id="btnSiguiente">Siguiente</button>
    </div>

</section>
</body>

</html>
